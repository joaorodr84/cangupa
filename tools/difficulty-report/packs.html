<title>Cangupa Level Packs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a ramp chart across all 300 levels, then one section per pack with a grid of level sketches.
     Data comes from packs.json next to this file (written by tools/gen-packs.js). */
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --fg: #17252a;
    --muted: #5d6d72;
    --line: #d9e0de;
    --accent: #0e6b68;
    --tile: #8fc9c4;
    --tile-2: #2c8c86;
    --start: #e4a11b;
    --band: #e9eeec;
    --font-display: "Figtree", system-ui, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a1c; --surface: #162326; --fg: #e3ecea; --muted: #8fa3a4; --line: #27393c; --band: #131f22;
      --accent: #4fc3bb; --tile: #3b8a85; --tile-2: #7fd4cd; --start: #f0b23a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a1c; --surface: #162326; --fg: #e3ecea; --muted: #8fa3a4; --line: #27393c; --band: #131f22;
    --accent: #4fc3bb; --tile: #3b8a85; --tile-2: #7fd4cd; --start: #f0b23a; color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-display);
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 1040px; margin: 0 auto; display: grid; gap: 28px; }
  h1 { font-size: 1.6rem; margin: 0; text-wrap: balance; }
  h2 { font-size: 1.15rem; margin: 0; }
  .lede { margin: 6px 0 0; color: var(--muted); max-width: 65ch; line-height: 1.5; font-size: .95rem; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .chart { overflow-x: auto; }
  .chart svg { display: block; min-width: 640px; width: 100%; height: auto; }
  .chart text { fill: var(--muted); font-family: var(--font-data); font-size: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .8rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  .pack { display: grid; gap: 12px; }
  .pack header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .pack .meta { font-family: var(--font-data); font-size: .8rem; color: var(--muted); }
  .pack p { margin: 0; color: var(--muted); font-size: .9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: grid; gap: 6px; justify-items: center; min-width: 0; }
  .card.designed { border-color: var(--accent); }
  .card .top { display: flex; justify-content: space-between; width: 100%; font-family: var(--font-data); font-size: .72rem; color: var(--muted); }
  .card .top b { color: var(--fg); font-family: var(--font-display); font-size: .85rem; }
  .card .tag { color: var(--accent); }
  svg.sketch { display: block; width: 88px; max-width: 100%; height: auto; }
  .t1 { fill: var(--tile); } .t2 { fill: var(--tile-2); }
  .st { fill: none; stroke: var(--start); stroke-width: 2.5; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; width: 100%; }
  .bar b { display: block; height: 100%; background: var(--accent); }
  .note { font-size: .8rem; color: var(--muted); max-width: 75ch; line-height: 1.55; }
  .note code { font-family: var(--font-data); font-size: .78rem; }
  .err { color: var(--muted); }
</style>

<main>
  <header>
    <h1>Cangupa level packs</h1>
    <p class="lede" id="lede">Loading packs…</p>
  </header>
  <section class="panel" aria-label="Difficulty across all levels">
    <h2>Difficulty ramp</h2>
    <div class="chart" id="chart"></div>
    <p class="note">Each dot is a level, in play order. Height is <code>pathBits</code>, the luck a blind player needs to retrace a solution. Bands are the packs. Outlined dots are designed layouts.</p>
  </section>
  <div class="legend" aria-label="Sketch key">
    <span><i style="background:var(--tile)"></i>Tile, one visit</span>
    <span><i style="background:var(--tile-2)"></i>Tile, two visits</span>
    <span><i style="background:none;border:2.5px solid var(--start)"></i>Start</span>
    <span><i style="background:none;border:1.5px solid var(--accent)"></i>Designed layout</span>
  </div>
  <div id="packs" class="pack-list" style="display:grid;gap:28px"></div>
</main>

<script>
  const SVG = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  function sketch(rows, label) {
    const w = rows[0].length, h = rows.length, box = 88;
    const cell = Math.floor(box / Math.max(w, h)), gap = Math.max(1, Math.round(cell / 8));
    const svg = el('svg', { viewBox: `0 0 ${w * cell} ${h * cell}`, class: 'sketch', width: w * cell, role: 'img', 'aria-label': label });
    rows.forEach((row, y) => {
      for (let x = 0; x < w; x++) {
        const c = row[x];
        if (c === '.') continue;
        const a = { x: x * cell + gap / 2, y: y * cell + gap / 2, width: cell - gap, height: cell - gap, rx: Math.max(1, cell / 8) };
        svg.appendChild(el('rect', { ...a, class: c === '2' || c === 's' ? 't2' : 't1' }));
        if (c === 'S' || c === 's') {
          svg.appendChild(el('rect', { ...a, x: a.x + 1, y: a.y + 1, width: a.width - 2, height: a.height - 2, class: 'st' }));
        }
      }
    });
    return svg;
  }

  function ramp(packs) {
    const all = packs.flatMap((p, pi) => p.levels.map((l, i) => ({ ...l, pi, i })));
    const W = 1000, H = 260, L = 34, R = 8, T = 10, B = 26;
    const max = Math.ceil(Math.max(...all.map(l => l.pathBits)) / 10) * 10;
    const X = n => L + (n / (all.length - 1)) * (W - L - R);
    const Y = v => T + (1 - v / max) * (H - T - B);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'pathBits for each level in play order' });
    let start = 0;
    packs.forEach((p, pi) => {
      const half = (X(1) - X(0)) / 2;
      const x0 = X(start) - (pi ? half : 0), x1 = X(start + p.levels.length - 1) + (pi < packs.length - 1 ? half : 0);
      start += p.levels.length;
      if (pi % 2 === 0) svg.appendChild(el('rect', { x: x0, y: T, width: x1 - x0, height: H - T - B, fill: 'var(--band)' }));
      const t = el('text', { x: (x0 + x1) / 2, y: H - 10, 'text-anchor': 'middle' });
      t.textContent = pi + 1;
      svg.appendChild(t);
    });
    for (let v = 0; v <= max; v += 10) {
      svg.appendChild(el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: 'var(--line)', 'stroke-width': .5 }));
      const t = el('text', { x: L - 6, y: Y(v) + 3, 'text-anchor': 'end' });
      t.textContent = v;
      svg.appendChild(t);
    }
    all.forEach((l, n) => {
      svg.appendChild(el('circle', {
        cx: X(n), cy: Y(l.pathBits), r: l.designed ? 3.2 : 2,
        fill: l.designed ? 'var(--surface)' : 'var(--accent)', stroke: 'var(--accent)', 'stroke-width': l.designed ? 1.5 : 0,
      }));
    });
    return svg;
  }

  function render(json) {
    const packs = json.packs, max = Math.max(...packs.flatMap(p => p.levels.map(l => l.pathBits)));
    document.getElementById('lede').textContent =
      `${packs.length} packs of ${packs[0].levels.length} levels. Boards grow from ${packs[0].width}×${packs[0].height} to ${packs[packs.length - 1].width}×${packs[packs.length - 1].height}; each pack is harder than the one before.`;
    document.getElementById('chart').replaceChildren(ramp(packs));
    document.getElementById('packs').replaceChildren(...packs.map((p, pi) => {
      const sec = document.createElement('section');
      sec.className = 'pack';
      const lo = p.levels[0].pathBits, hi = p.levels[p.levels.length - 1].pathBits;
      const designed = p.levels.filter(l => l.designed).length;
      sec.innerHTML = `<header><h2>${pi + 1}. ${p.name}</h2>
        <span class="meta">${p.width}×${p.height} · pathBits ${lo} to ${hi} · ${designed} designed</span></header>
        <p>${p.blurb}</p>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      p.levels.forEach((l, i) => {
        const c = document.createElement('div');
        c.className = 'card' + (l.designed ? ' designed' : '');
        c.innerHTML = `<div class="top"><b>${pi + 1}-${i + 1}</b><span>${l.pathBits}</span></div>`;
        c.appendChild(sketch(l.rows, `Pack ${pi + 1} level ${i + 1}`));
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.innerHTML = `<b style="width:${(100 * l.pathBits / max).toFixed(1)}%"></b>`;
        c.appendChild(bar);
        if (l.designed) { const t = document.createElement('div'); t.className = 'top'; t.innerHTML = `<span class="tag">${l.designed}</span>`; c.appendChild(t); }
        grid.appendChild(c);
      });
      sec.appendChild(grid);
      return sec;
    }));
  }

  // Beside the page when published; one folder up (tools/packs.json) when served from the repo.
  const load = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  load('packs.json').catch(() => load('../packs.json')).then(render).catch(() => {
    document.getElementById('lede').textContent = 'Could not load packs.json.';
    document.getElementById('packs').innerHTML = '<p class="err">packs.json was not found. Serve the tools/ folder over HTTP (for example <code>python3 -m http.server</code> from tools/, then open difficulty-report/packs.html), because browsers block fetch() on file:// pages.</p>';
  });
</script>
